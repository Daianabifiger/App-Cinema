<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Hollywow Cinema</title>
        <link rel="icon" type="image/png" href="assets/icono - copia.png">

        <!--Link Bootstrap--> 
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
        <!--Iconos-->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

        <!--Link css--> 
        <link rel="stylesheet" href="./style.css">
    </head>

    <body class="bg-body bg-size min-vh-100">
        
        <!--header-->
        <header>
            <nav class="navbar-expand-lg py-2">
                <div class="container-fluid d-flex flex-wrap justify-content-between align-items-center px-3 gap-2">
                    <a class="navbar-brand d-flex align-items-center gap-3 m-0 order-1" href="#">
                        <img src="assets/logonombre.png" alt="Logo" width="180" height="60" class="d-inline-block align-text-top img-fluid">
                    </a>

                    <!--Botones carrito y user (arriba a la derecha en mobile, a la derecha en desktop)-->
                    <div class="d-flex align-items-center gap-3 order-2 lg:order-3">
                        <button id="login" class="btn custom-btn-circle rounded-circle position-relative color-neon" type="button" title="Perfil de usuario">
                            <i class="bi bi-person-fill"></i>
                        </button>
                        <span id="useName-nav" class="text-white color-neon small ms-1 d-none"></span>

                        <button class="btn custom-btn-circle rounded-circle position-relative color-neon" 
                                type="button" 
                                title="Carrito"
                                data-bs-toggle="drawer"
                                data-bs-target="#panelCarrito"
                                aria-controls="panelCarrito">
                            <i class="bi bi-cart-fill"></i>
                            <span id="contador-carrito" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-neon fg-black">
                                0
                            </span>
                        </button>
                    </div>
                    
                    <!--Barra de busqueda (100% abajo en mobile con col-12, 50% al centro en laptop con lg:col-6)-->
                    <div class="position-relative mx-auto col-12 lg:col-6 mt-2 order-3 lg:order-2">
                        <div class="position-absolute top-0 bottom-0 start-0 d-flex align-items-center ms-3 z-3 pe-none">
                            <i class="bi bi-search text-secondary ps-2"></i>
                        </div>
                        <input id="input-buscador" type="text" class="form-control ps-12 rounded-pill bg-transp border border-light border-opacity-25 text-white py-2 ps-5 pe-3" placeholder="Buscar película ...">
                    </div>
                </div>
            </nav>
        </header>

        <!--Body-->
        <main class="container-fluid">
            <div class="row m-0 p-0">
                <div id="contenedor-sidebar" class="d-flex col-12 md:col-auto px-4 mt-4 gap-4">
                    <!--menu vertical colapsable-->
                    <aside id="sidebarMenu" class="custom-sidebar d-flex flex-column">
                        
                        <!--Boton abrir y cerrar barra menu-->
                        <div id="contenedor-btn-sidebar" class="mb-4">
                            <button id="btnToggleSidebar" 
                                    class="btn custom-btn-circle d-flex justify-content-center align-items-center bg-neon fg-black" 
                                    data-bs-target=".texto-menu"
                                    data-bs-toggle="collapse"
                                    type="button" 
                                    title="Abrir barra lateral">
                                <i class="bi bi-layout-sidebar-inset fs-5"></i>
                            </button>
                        </div>

                        <!--opciones de menu-->
                        <nav class="nav flex-column gap-2">
                            <a class="nav-link d-flex gap-3 justify-content-start custom-nav-link color-neon rounded-pill active" href="#" title="Inicio" data-bs-target="inicio">
                                <i class="bi bi-house-door-fill fs-5"></i>
                                <span class="collapse collapse-horizontal fade sidebar-text texto-menu fw-bold ps-2 text-nowrap">Inicio</span>
                            </a>

                            <a class="nav-link d-flex justify-content-start gap-3 custom-nav-link color-neon rounded-pill" href="#" title="Cartelera" data-bs-target="cartelera">
                                <i class="bi bi-film fs-5"></i>
                                <span class="collapse collapse-horizontal fade sidebar-text texto-menu fw-bold text-nowrap">Cartelera</span>
                            </a>

                            <a class="nav-link d-flex justify-content-start gap-3 custom-nav-link color-neon rounded-pill" href="#" title="Combos" data-bs-target="combos">
                                <i class="bi bi-basket2-fill fs-5"></i>
                                <span class="collapse collapse-horizontal fade sidebar-text texto-menu fw-bold text-nowrap">Combo</span>
                            </a>

                            <a class="nav-link d-flex justify-content-start gap-3 custom-nav-link color-neon rounded-pill" href="#" title="Próximos Estrenos" data-bs-target="estrenos">
                                <i class="bi bi-calendar-event-fill fs-5"></i>
                                <span class="collapse collapse-horizontal fade sidebar-text texto-menu fw-bold text-nowrap">Próximos Estrenos</span>
                            </a>
                        </nav>
                    </aside>
                </div>

                <!--Section inicio-->
                <section id="inicio" class="flex-grow-1 col min-w-0 mt-3 seccion-vista"> <!--flex-grow-1 col hace que ocupe el resto de la pantalla-->
                    <!--Carrousel novedades-->
                    <div id="carouselExampleInterval" class="carousel slide" data-bs-autoplay="true" data-bs-ends="loop">
                        <div class="carousel-inner rounded-4 h-75">
                            <div class="carousel-item active" data-bs-interval="3000">
                                <img src="assets/Promos/promo1.png" class="d-block w-100 h-100" alt="promo2x1">
                            </div>
                            <div class="carousel-item" data-bs-interval="3000">
                                <img src="assets/Promos/promo2.png" class="d-block w-100 h-100" alt="promo15off">
                            </div>
                            <div class="carousel-item" data-bs-interval="3000">
                                <img src="assets/Promos/promo3.png" class="d-block w-100 h-100" alt="promofliar">
                            </div>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <div class="carousel-indicators">
                                <button type="button" data-bs-target="#carouselExampleInterval" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                                <button type="button" data-bs-target="#carouselExampleInterval" data-bs-slide-to="1" aria-label="Slide 2"></button>
                                <button type="button" data-bs-target="#carouselExampleInterval" data-bs-slide-to="2" aria-label="Slide 3"></button>
                            </div>
                                <button class="btn-icon btn-sm carousel-control-play-pause" type="button" data-bs-target="#carouselExampleInterval" aria-label="Pause" data-bs-pause-label="Pause" data-bs-play-label="Play">
                                <span class="carousel-icon-pause" aria-hidden="true"></span>
                                <span class="carousel-icon-play" aria-hidden="true"></span>
                            </button>
                        </div>
                    </div>

                    <!--Contenedor de cards promociones-->
                    <div class="container my-5 pt-4 gap-3">

                        <div id="carouselMultiple" class="carousel slide carouselMultiple" data-bs-ends="stop">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h3 class="text-white mb-0 text-uppercase">Promociones Vigentes</h3>
                                <div class="d-flex gap-2">
                                    <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselMultiple" data-bs-slide="prev" style="--bs-carousel-control-icon-width: 1rem;">
                                        <span class="carousel-icon-prev" aria-hidden="true"></span>
                                        <span class="visually-hidden">Previous</span>
                                    </button>
                                    <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselMultiple" data-bs-slide="next" style="--bs-carousel-control-icon-width: 1rem;">
                                        <span class="carousel-icon-next" aria-hidden="true"></span>
                                        <span class="visually-hidden">Next</span>
                                    </button>
                                </div>
                            </div>

                            <div id="contenedor-promos" class="carousel-inner d-flex flex-nowrap overflow-x-auto gap-3 scrollbar-invisible">
                                <!--Arreglo de cards-->
                            </div>
                        </div>
                    </div>
                </section>
                
                <!--Section cartelera-->
                <section id="cartelera" class="flex-grow-1 col min-w-0 seccion-vista d-none">
                    <h1 class="fst-italic fw-semibold my-4 text-center text-uppercase">- Cartelera -</h1>
                    <div id="lista-cartelera" class="row g-4 justify-content-center m-0">
                        <!--Cards de cartelera-->
                    </div>
                </section>
                
                <!--Section combos-->
                <section id="combos" class="flex-grow-1 col min-w-0 seccion-vista d-none">
                    <h2 class="fst-italic fw-semibold my-4 text-center text-uppercase">- Combos Candybar -</h2>
                    <div id="lista-combos" class="row g-4 justify-content-center m-0">
                        <!--Cards de combos-->
                    </div>
                </section>

                <!--Section proximos estrenos-->
                <section id="estrenos" class="flex-grow-1 col min-w-0 seccion-vista d-none">
                    <h2 class="fst-italic fw-semibold my-4 text-center text-uppercase">- Próximos Estrenos -</h2>
                    <div id="lista-estsrenos" class="row g-4 justify-content-center m-0">
                        <!--Cards de estrenos-->
                    </div>
                </section>

            </div>
        </main>

        <!--Carrito-->
        <dialog class="drawer drawer-end text-bg-dark max-w-100" tabindex="-1" id="panelCarrito" aria-labelledby="panelCarritoLabel">

            <!--Encabezado del carrito-->
            <div class="drawer-header d-flex flex-column align-items-start border-bottom border-secondary pt-4 pb-2 px-4">
                <button type="button" class="btn-close mt-1 mb-3" data-bs-dismiss="drawer" aria-label="Close"></button>
                <h5 class="drawer-title fw-bold color-neon" id="panelCarritoLabel">
                    <i class="bi bi-basket2-fill me-2"></i>Mi Carrito
                </h5>
            </div>

            <!--Cuerpo carrito-->
            <div class="drawer-body d-flex flex-column justify-content-between p-0 h-100">
                <!-- Lista de productos -->
                <div id="items-carrito" class="d-flex flex-column gap-3 px-4 py-3 overflow-auto flex-grow-1">
                    <p class="text-secondary text-center my-5">Tu carrito está vacío.</p>
                </div>

                <!--pie carrito-->
                <div class="border-top border-secondary px-6 pt-3 pb-6 mt-auto">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="fs-5">Total:</span>
                        <span id="total-carrito" class="fs-4 fw-bold color-neon">$0</span>
                    </div>
                    <button id="btn-finalizar" class="btn bg-neon fg-black fw-bold w-100 rounded-pill py-2 text-uppercase">
                        Finalizar Compra
                    </button>
                </div>

            </div>

        </dialog>

        <!--Alerta agregado correctamente-->
        <div class="toast-container position-fixed bottom-0 end-0 p-4 z-3">
            <div id="toast-carrito" class="toast bg-neon fg-black border-0 shadow-lg opacity-75" role="alert" aria-live="assertive" aria-atomic="true">
                <div class="d-flex justify-content-between align-items-center">
                    <div class="toast-body fw-bold d-flex align-items-center gap-2">
                        <i class="bi bi-check-circle-fill fs-5"></i>
                        <span id="mensaje-toast">Producto agregado al carrito correctamente.</span>
                    </div>
                    <button type="button" class="btn-close me-3 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                </div>
            </div>
        </div>

        <!--Footer-->
        <footer class="d-flex flex-column justify-content-center align-items-center py-4 mt-5">
            <img src="assets/logonombre.png" alt="Hollywow Cinema" class="mb-2" width="180">
            <p class="fw-bold fst-italic mb-0">Hollywow Cinema</p>
        </footer>

        <!--JS Bootstrap--> 
        <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>

        <!--JS personal-->
        <script src="JS/compartido.js"></script>
        <script src="JS/script.js"></script>
    </body>

</html>
