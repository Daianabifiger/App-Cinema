<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Hollywow Cinema</title>
        <link rel="icon" type="image/png" href="assets/icono.png">

        <!--Link Bootstrap--> 
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
        <!--Iconos-->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

        <!--Link css--> 
        <link rel="stylesheet" href="./style.css">
    </head>

    <body class="bg-body bg-size min-vh-100">
        
        <!--header-->
        <header>
            <nav class="navbar-expand-lg">
                <div class="container-fluid justify-content-between d-flex px-4">
                    <a class="navbar-brand d-flex align-items-center gap-3 pe-5" href="#">
                        <img src="assets/logonombre.png" alt="Logo" width="180" height="60" class="d-inline-block align-text-top">
                    </a>
                    
                    <!--Barra de busqueda-->
                    <div class="position-relative mx-auto w-50 pe-5 mt-4">
                        <div class="position-absolute top-0 bottom-0 start-0 d-flex align-items-center ms-3 z-3 pe-none">
                            <i class="bi bi-search text-secondary ps-3 pb-3"></i>
                        </div>
                        <input type="text" class="form-control ps-12 rounded-pill bg-transp border border-light border-opacity-25 text-white py-2 ps-5 pe-3" id="buscadorPelis" placeholder="Buscar película ...">
                    </div>

                    <!--Botones carrito y user-->
                    <div class="d-flex align-items-center gap-3">
                        <button class="btn custom-btn-circle rounded-circle d-flex justify-content-center align-items-center color-neon" type="buttom" title="Perfil de usuario">
                            <i class="bi bi-person-fill"></i>
                        </button>

                        <button class="btn custom-btn-circle rounded-circle d-flex justify-content-center align-items-center color-neon" type="buttom" title="Perfil de usuario">
                            <i class="bi bi-cart-fill"></i>
                        </button>
                    </div>
                </div>
            </nav>
        </header>

        <!--Body-->
        <body class="container-fluid">
            <div class="row">
                <div class="d-flex col-auto px-4 mt-4 gap-4">
                    <!--menu vertical colapsable-->
                    <aside id="sidebarMenu" class="custom-sidebar d-flex flex-column">
                        
                        <!--Boton abrir y cerrar barra menu-->
                        <div class="mb-4">
                            <button id="btnToggleSidebar" 
                                    class="btn custom-btn-circle d-flex justify-content-center align-items-center color-neon" 
                                    data-bs-target=".texto-menu"
                                    data-bs-toggle="collapse"
                                    type="button" 
                                    title="Abrir barra lateral">
                                <i class="bi bi-layout-sidebar-inset fs-5"></i>
                            </button>
                        </div>

                        <!--opciones de menu-->
                        <nav class="nav flex-column gap-2">
                            <a class="nav-link d-flex gap-3 justify-content-start custom-nav-link color-neon rounded-pill pe-0" href="#" title="Inicio" data-bs-target="inicio">
                                <i class="bi bi-house-door-fill fs-5"></i>
                                <span class="collapse collapse-horizontal fade sidebar-text texto-menu fw-bold ps-2 text-nowrap">Inicio</span>
                            </a>

                            <a class="nav-link d-flex justify-content-start gap-3 custom-nav-link color-neon rounded-pill" href="#" title="Cartelera" data-bs-target="cartelera">
                                <i class="bi bi-film fs-5"></i>
                                <span class="collapse collapse-horizontal fade sidebar-text texto-menu fw-bold text-nowrap">Cartelera</span>
                            </a>

                            <a class="nav-link d-flex justify-content-start gap-3 custom-nav-link color-neon rounded-pill" href="#" title="Combos" data-bs-target="combos">
                                <i class="bi bi-basket2-fill fs-5"></i>
                                <span class="collapse collapse-horizontal fade sidebar-text texto-menu fw-bold text-nowrap">Combo</span>
                            </a>

                            <a class="nav-link d-flex justify-content-start gap-3 custom-nav-link color-neon rounded-pill" href="#" title="Próximos Estrenos" data-bs-target="estrenos">
                                <i class="bi bi-calendar-event-fill fs-5"></i>
                                <span class="collapse collapse-horizontal fade sidebar-text texto-menu fw-bold text-nowrap">Próximos Estrenos</span>
                            </a>
                        </nav>
                    </aside>
                </div>

                <!--Section inicio-->
                <section id="inicio" class="flex-grow-1 col min-w-0 seccion-vista d-none"> <!--fle-grow-1 col hace que ocupe el resto de la pantalla-->
                    <!--Carrousel novedades-->
                    <div id="carouselExampleInterval" class="carousel slide" data-bs-autoplay="true" data-bs-ends="loop">
                        <div class="carousel-inner rounded-5 h-75">
                            <div class="carousel-item active" data-bs-interval="3000">
                                <img src="assets/promo1.png" class="d-block w-100 h-100" alt="promo2x1">
                            </div>
                            <div class="carousel-item" data-bs-interval="3000">
                                <img src="assets/promo2.png" class="d-block w-100 h-100" alt="promo15off">
                            </div>
                            <div class="carousel-item" data-bs-interval="3000">
                                <img src="assets/promo3.png" class="d-block w-100 h-100" alt="promofliar">
                            </div>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <div class="carousel-indicators">
                                <button type="button" data-bs-target="#carouselExampleInterval" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                                <button type="button" data-bs-target="#carouselExampleInterval" data-bs-slide-to="1" aria-label="Slide 2"></button>
                                <button type="button" data-bs-target="#carouselExampleInterval" data-bs-slide-to="2" aria-label="Slide 3"></button>
                            </div>
                                <button class="btn-icon btn-sm carousel-control-play-pause" type="button" data-bs-target="#carouselExampleInterval" aria-label="Pause" data-bs-pause-label="Pause" data-bs-play-label="Play">
                                <span class="carousel-icon-pause" aria-hidden="true"></span>
                                <span class="carousel-icon-play" aria-hidden="true"></span>
                            </button>
                        </div>
                    </div>

                    <!--Contenedor de cards promociones-->
                    <div class="container my-5 pt-4">

                        <div id="carouselMultiple" class="carousel slide" data-bs-ends="stop" style="--bs-carousel-items: 3; --bs-carousel-items-gap: 1rem;">
                            <div class="d-flex justify-content-between align-items-center">
                                <h3 class="text-white mb-4 text-uppercase align-items-center justify-content-center">Promociones Vigentes</h3>
                                <div>
                                    <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselMultiple" data-bs-slide="prev" style="--bs-carousel-control-icon-width: 1rem;">
                                        <span class="carousel-icon-prev" aria-hidden="true"></span>
                                        <span class="visually-hidden">Previous</span>
                                    </button>
                                    <button class="btn-icon btn-sm" type="button" data-bs-target="#carouselMultiple" data-bs-slide="next" style="--bs-carousel-control-icon-width: 1rem;">
                                        <span class="carousel-icon-next" aria-hidden="true"></span>
                                        <span class="visually-hidden">Next</span>
                                    </button>
                                </div>
                            </div>

                            <div id="contenedor-promos" class="carousel-inner">
                                <!--Arreglo de cards-->
                            </div>
                        </div>
                    </div>
                </section>
                
                <!--Section cartelera-->
                <section id="cartelera" class="flex-grow-1 col min-w-0 seccion-vista d-none">
                    <h1 class="fst-italic fw-semibold my-5 d-flex justify-content-center">- Cartelera -</h1>
                    <div id="lista-cartelera" class="row col-lg-6 justify-content-center">
                        <!--Cards de cartelera-->
                    </div>
                </section>
                
                <!--Section combos-->
                <section id="combos" class="flex-grow-1 col min-w-0 seccion-vista">
                    <h2 class="fst-italic fw-semibold my-5 d-flex justify-content-center">- Combos Candybar -</h2>
                    <div id="lista-combos" class="row col-lg-6 justify-content-center">
                        <!--Cards de combos-->
                    </div>
                </section>
            </div>
        </body>

        <!--Footer-->
        <footer class="d-flex flex-column justify-content-center align-items-center py-4 mt-5">
            <img src="assets/logonombre.png" alt="Hollywow Cinema" class="mb-2" width="180">
            <p class="fw-bold fst-italic mb-0">Hollywow Cinema</p>
        </footer>

        <!--JS Bootstrap--> 
        <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>

        <!--JS personal-->
        <script src="script.js"></script>
    </body>

</html>
