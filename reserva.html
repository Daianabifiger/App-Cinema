<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Hollywow Cinema - Reserva</title>
        <link rel="icon" type="image/png" href="assets/icono - copia.png">

        <!--Link Bootstrap--> 
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
        <!--Iconos-->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

        <!--Link css--> 
        <link rel="stylesheet" href="./style.css">
    </head>

    <body class="bg-body bg-size min-vh-100">
        
        <!--header-->
        <header>
            <nav class="navbar-expand-lg">
                <div class="container-fluid justify-content-between d-flex px-4">
                    <a class="navbar-brand d-flex align-items-center gap-3 pe-5" href="#">
                        <img src="assets/logonombre.png" alt="Logo" width="180" height="60" class="d-inline-block align-text-top">
                    </a>
                    
                    <!--Barra de busqueda-->
                    <div class="position-relative mx-auto w-50 pe-5 mt-4">
                        <div class="position-absolute top-0 bottom-0 start-0 d-flex align-items-center ms-3 z-3 pe-none">
                            <i class="bi bi-search text-secondary ps-3 pb-3"></i>
                        </div>
                        <input id="input-buscador" type="text" class="form-control ps-12 rounded-pill bg-transp border border-light border-opacity-25 text-white py-2 ps-5 pe-3" id="buscadorPelis" placeholder="Buscar película ...">
                    </div>

                    <!--Botones carrito, home y user-->
                    <div class="d-flex align-items-center gap-3">
                        <button class="btn custom-btn-circle rounded-circle position-relative color-neon" type="buttom" title="Volver a Inicio">
                            <i class="bi bi-house-door-fill"></i>
                        </button>

                        <button class="btn custom-btn-circle rounded-circle position-relative color-neon" type="buttom" title="Perfil de usuario">
                            <i class="bi bi-person-fill"></i>
                        </button>

                        <button class="btn custom-btn-circle rounded-circle position-relative color-neon" 
                                type="buttom" 
                                title="Carrito"
                                data-bs-toggle="drawer"
                                data-bs-target="#panelCarrito"
                                aria-controls="panelCarrito">
                            <i class="bi bi-cart-fill"></i>
                            <span id="contador-carrito" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-neon fg-black">
                                0
                            </span>
                        </button>
                    </div>
                </div>
            </nav>
        </header>

        <body class="container-fluid">
            <div class="row">
                <!--Seleccion de ticket-->
                <div classs="col-12 col-lg-8">
                    <div class="row">
                        <div class="col-4 col-mb-3">
                            <img src="..." alt="..." class="img-fluid rounded">
                        </div>
                        <div class="col-8 col-mb-9">
                            <h2 class="fw-semibold fst-italic ps-4">Titulo de película</h2>

                            <div class="d-flex justify-content-between mb-4 mx-4">
                                <span class="ps-4">Géneros</span>
                                <span class="ps-4">Calificacion</span>
                                <span class="ps-4">Idioma</span>
                                <span class="ps-4">Formato</span>
                            </div>

                            <div class="d-flex align-items-center  p-3">
                                <button class="btn-solid d-flex gap-2 rounded-3 bg-neon fg-black m-2">Horario 1</button>
                                <button class="btn-solid d-flex gap-2 rounded-3 bg-neon fg-black">Horario 2</button>
                            </div>
                        </div>
                    </div>

                    <!--Selector de fechas-->
                    <div class="d-flex align-items-center justify-content-center gap-2 my-4">
                        <button class="btn btn-link text-success p-0 me-2 border-0" aria-label="Anterior"">
                            <i class="bi bi-chevron-left fs-3"></i>
                        </button>

                        
                    </div>
                </div>

                <!--Resuemn y confirmacion-->
                <div class="col-12 col-lg-4">

                </div>

            </div>
        </body>

        <!--Carrito-->
        <dialog class="drawer drawer-end text-bg-dark max-w-100 w-25" tabindex="-1" id="panelCarrito" aria-labelledby="panelCarritoLabel">

            <!--Encabezado del carrito-->
            <div class="drawer-header d-flex flex-column align-items-start border-bottom border-secondary pt-4 pb-2 px-4">
                <button type="button" class="btn-close mt-1 mb-3" data-bs-dismiss="drawer" aria-label="Close"></button>
                <h5 class="drawer-title fw-bold color-neon" id="panelCarritoLabel">
                    <i class="bi bi-basket2-fill me-2"></i>Mi Carrito
                </h5>
            </div>

            <!--Cuerpo carrito-->
            <div class="drawer-body d-flex flex-column justify-content-between p-0 h-100">
                <!-- Lista de productos -->
                <div id="items-carrito" class="d-flex flex-column gap-3 px-4 py-3 overflow-auto flex-grow-1">
                    <p class="text-secondary text-center my-5">Tu carrito está vacío.</p>
                </div>

                <!--pie carrito-->
                <div class="border-top border-secondary px-6 pt-3 pb-6 mt-auto">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="fs-5">Total:</span>
                        <span id="total-carrito" class="fs-4 fw-bold color-neon">$0</span>
                    </div>
                    <button id="btn-finalizar" class="btn bg-neon fg-black fw-bold w-100 rounded-pill py-2 text-uppercase">
                        Finalizar Compra
                    </button>
                </div>

            </div>

        </dialog>

        <!--Alerta agregado correctamente-->
        <div class="toast-container postion-fixed bottom-0 end-0 p-4 z-3">
            <div id="toast-carrito" class="toast bg-neon fg-black border-0 shadow-lg opacity-75" role="alert" aria-live="assertive" aria-atomic="true">
                <div class="d-flex justify-content-between align-items-center">
                    <div class="toast-body fw-bold d-flex align-items-center gap-2">
                        <i class="bi bi-check-circle-fill fs-5"></i>
                        <span id="mensaje-toast">Producto agregado al carrito correctamente.</span>
                    </div>
                    <button type="button" class="btn-close me-3 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                </div>
            </div>
        </div>

        <!--Footer-->
        <footer class="d-flex flex-column justify-content-center align-items-center py-4 mt-5">
            <img src="assets/logonombre.png" alt="Hollywow Cinema" class="mb-2" width="180">
            <p class="fw-bold fst-italic mb-0">Hollywow Cinema</p>
        </footer>

        <!--JS Bootstrap--> 
        <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>

        <!--JS personal-->
        <script src="script.js"></script>
        <script src="reserva.js"></script>
    </body>

</html>
